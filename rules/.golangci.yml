# The vendored rules engine (this module) keeps the relaxed linter set it had
# before the repository adopted the gopherstack rules (see ../.golangci.yml).
# make lint-run picks this file for MODULE=rules. Out of scope of that change.
version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    #    - canonicalheader
    #    - containedctx
    #    - contextcheck
    - copyloopvar
    #    - cyclop
    - decorder
    #    - depguard
    - dogsled
    - dupl
    #    - dupword
    - durationcheck
    #    - err113
    #    - errcheck
    #    - errchkjson
    - errname
    #    - errorlint
    #    - exhaustive
    #    - exhaustruct
    - exptostd
    - fatcontext
    #    - forbidigo
    #    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    #    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    #    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    #    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    #    - inamedparam
    - ineffassign
    - interfacebloat
    #    - intrange
    #    - ireturn
    - lll
    - loggercheck
    #    - maintidx
    - makezero
    - mirror
    - misspell
    #    - mnd
    - musttag
    - nakedret
    #    - nestif
    - nilerr
    - nilnesserr
    #    - nilnil
    #    - nlreturn
    - noctx
    #    - nolintlint
    #    - nonamedreturns
    - nosprintfhostport
    #    - paralleltest
    #    - perfsprint
    - prealloc
    - predeclared
    #    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    #    - tagalign
    #    - tagliatelle
    - testableexamples
    #    - testifylint
    #    - testpackage
    #    - thelper
    - unconvert
    - unparam
    - unused
    #    - usestdlibvars
    #    - usetesting
    #    - varnamelen
    - wastedassign
    - whitespace
    #    - wrapcheck
    #    - wsl
    - zerologlint
  settings:
    revive:
      confidence: 0.8
    funlen:
      lines: 90
      statements: 50
    gocritic:
      disabled-checks:
        - singleCaseSwitch
    gosec:
      excludes:
        - G304
    gosimple:
      checks: ["all", "-S1023"]
    gomoddirectives:
      replace-local: true
      replace-allow-list:
        # the rules engine lives in rules/ of this repository
        - github.com/nikunjy/rules
        # modules/core is resolved from this repository
        - github.com/blackbirdworks/semaphore/modules/core
        # fix for Athena v3 parquet query issue - https://github.com/xitongsys/parquet-go/issues/547
        - github.com/xitongsys/parquet-go
        - github.com/apache/thrift
  exclusions:
    paths:
      - (^|/)bin($|/)
      - (^|/)docs($|/)
      - (^|/)rules($|/)
      # verbatim copy of github.com/thomaspoignant/koanf-http-provider, see NOTICE
      - (^|/)internal/koanfhttpprovider($|/)
    rules:
      - path: testutils/
        linters:
          - revive
      - path: cmd/relayproxy/modeldocs/
        linters:
          - lll
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - funlen
          - maligned
          - noctx
          - scopelint
          - bodyclose
          - lll
          - goconst
          - gocognit
          - gocyclo
          - gochecknoinits
          - dupl
          - staticcheck
          - revive
          - gosec
          - copyloopvar
      - path: _mock\.go
        linters:
          - errcheck
          - funlen
          - maligned
          - noctx
          - scopelint
          - bodyclose
          - lll
          - goconst
          - gocognit
          - gocyclo
          - gochecknoinits
          - dupl
          - staticcheck
          - revive
          - predeclared
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  #    - golines
  settings:
    gofumpt:
      module-path: github.com/blackbirdworks/semaphore
    gci:
      no-lex-order: true
    gofmt:
      simplify: false
      rewrite-rules:
        #        - pattern: 'interface{}'
        #          replacement: 'any'
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
  exclusions:
    paths:
      - (^|/)bin($|/)
      - (^|/)docs($|/)
      - (^|/)rules($|/)
issues:
  # See the dedicated "issues" documentation section.
  max-issues-per-linter: 0
