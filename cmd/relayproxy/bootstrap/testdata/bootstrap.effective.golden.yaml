connections:
  control:
    credentials:
      type: chain
    timeouts:
      connect: 10s
      request: 30s
    retry:
      maxAttempts: 3
      maxBackoff: 20s
    region: us-east-1
    poll:
      interval: 60s
      jitter: 0.1
    type: s3
    bucket: acme-control
    requestChecksumCalculation: whenSupported
    responseChecksumValidation: whenSupported
  dev-s3:
    credentials:
      type: static
      accessKeyId:
        fromEnv: DEV_S3_ACCESS_KEY
      secretAccessKey:
        fromFile: /run/secrets/dev-s3-secret
    timeouts:
      connect: 10s
      request: 30s
    retry:
      maxAttempts: 3
      maxBackoff: 20s
    endpoint: http://localhost:4566
    region: us-east-1
    caBundleFile: /etc/ssl/emulator-ca.pem
    poll:
      interval: 60s
      jitter: 0.1
    type: s3
    bucket: dev-flags
    requestChecksumCalculation: whenRequired
    responseChecksumValidation: whenRequired
    pathStyle: true
  events-kinesis:
    credentials:
      type: chain
    timeouts:
      connect: 10s
      request: 30s
    retry:
      maxAttempts: 3
      maxBackoff: 20s
    region: us-east-1
    type: kinesis
    stream: acme-flag-evals
  events-queue:
    credentials:
      type: chain
    timeouts:
      connect: 10s
      request: 30s
    retry:
      maxAttempts: 3
      maxBackoff: 20s
    region: us-east-1
    type: sqs
    queueUrl: https://sqs.us-east-1.amazonaws.com/123456789012/evals
  flags-eu:
    credentials:
      type: assumeRole
      roleArn: arn:aws:iam::123456789012:role/semaphore-reader
      sessionName: semaphore
    timeouts:
      connect: 5s
      request: 20s
    retry:
      maxAttempts: 5
      maxBackoff: 30s
    region: eu-west-1
    poll:
      interval: 60s
      jitter: 0.1
    type: s3
    bucket: acme-flags-eu
    requestChecksumCalculation: whenSupported
    responseChecksumValidation: whenSupported
  local-control:
    type: file
    path: /var/lib/semaphore/control
  segments-redis:
    timeouts:
      connect: 2s
      read: 500ms
      write: 500ms
    maxRetries: 2
    poolSize: 20
    type: redis
    password:
      fromFile: /run/secrets/redis-password
    addresses:
      - redis:6379
    db: 2
    atomic: true
  segments-valkey:
    tls:
      serverName: valkey.internal
      caBundleFile: /etc/ssl/valkey-ca.pem
      enable: true
    timeouts:
      connect: 2s
      io: 1s
    atomic: true
    lookupTimeout: 150ms
    type: valkey
    username: semaphore
    pipelining: auto
    keyPrefix: 'acme:segment:'
    password:
      fromEnv: VALKEY_PASSWORD
    addresses:
      - valkey-1:6379
      - valkey-2:6379
    blockingPipeline: 64
  warehouse:
    credentials:
      type: chain
    timeouts:
      connect: 10s
      request: 30s
    retry:
      maxAttempts: 3
      maxBackoff: 20s
    region: us-east-1
    type: redshift
exporters:
  evals-archive:
    flushInterval: 60s
    maxEventInMemory: 100000
    retry:
      maxAttempts: 5
      initialBackoff: 200ms
      maxBackoff: 5s
      maxElapsed: 30s
      onExhausted: keep
    blockTimeout: 50ms
    drainTimeout: 10s
    format: parquet
    overflowPolicy: dropNewest
    parquetCompressionCodec: SNAPPY
    path: evaluations/
    connection: flags-eu
    kind: s3
  evals-kafka:
    flushInterval: 60s
    maxEventInMemory: 100000
    retry:
      maxAttempts: 5
      initialBackoff: 200ms
      maxBackoff: 5s
      maxElapsed: 30s
      onExhausted: keep
    blockTimeout: 50ms
    drainTimeout: 10s
    kafka:
      topic: flag-evaluations
      addresses:
        - kafka-1:9092
    overflowPolicy: dropNewest
    kind: kafka
  evals-kinesis:
    flushInterval: 60s
    maxEventInMemory: 100000
    retry:
      maxAttempts: 5
      initialBackoff: 200ms
      maxBackoff: 5s
      maxElapsed: 30s
      onExhausted: keep
    blockTimeout: 50ms
    drainTimeout: 10s
    overflowPolicy: dropNewest
    connection: events-kinesis
    kind: kinesis
  evals-log:
    flushInterval: 60s
    maxEventInMemory: 100000
    retry:
      maxAttempts: 5
      initialBackoff: 200ms
      maxBackoff: 5s
      maxElapsed: 30s
      onExhausted: keep
    blockTimeout: 50ms
    drainTimeout: 10s
    overflowPolicy: dropNewest
    kind: log
  evals-warehouse:
    flushInterval: 60s
    maxEventInMemory: 100000
    retry:
      maxAttempts: 5
      initialBackoff: 200ms
      maxBackoff: 5s
      maxElapsed: 30s
      onExhausted: keep
    blockTimeout: 50ms
    drainTimeout: 10s
    overflowPolicy: dropNewest
    connection: warehouse
    tableName: flag_evaluations
    database: analytics
    kind: redshift
    workgroupName: semaphore
  evals-webhook:
    headers:
      Authorization:
        fromEnv: EVALS_WEBHOOK_TOKEN
    flushInterval: 60s
    maxEventInMemory: 100000
    retry:
      maxAttempts: 5
      initialBackoff: 200ms
      maxBackoff: 5s
      maxElapsed: 30s
      onExhausted: keep
    blockTimeout: 50ms
    drainTimeout: 10s
    overflowPolicy: dropNewest
    kind: webhook
    endpointUrl:
      fromEnv: EVALS_WEBHOOK_URL
notifiers:
  audit-hook:
    kind: webhook
    endpointUrl:
      fromFile: /run/secrets/audit-url
    secret:
      fromFile: /run/secrets/audit-signing
  team-slack:
    kind: slack
    webhookUrl:
      fromEnv: SLACK_WEBHOOK_URL
controlPlane:
  manifest:
    pollInterval: 60s
    jitter: 0.1
    maxObjects: 20000
    key: manifests/prod-us-east-1/stable.json
    channel: stable
  connection: control
  stateDir: /var/lib/semaphore
segments:
  resolver:
    callTimeout: 2s
    shutdownGrace: 5s
    maxOverdue: 8
    maxIdBytes: 512
    default:
      ttl: 30s
      negativeTtl: 5s
      breakerCooldown: 10s
      maxEntries: 10000
      shards: 16
      breakerFailures: 5
      noCache: false
      noBreaker: false
      normalize: trimLower
server:
  listeners:
    - name: api
      address: :1031
      role: api
      protocols:
        - http1
        - h2c
    - name: ops
      address: :1032
      role: ops
      protocols:
        - http1
  shutdown:
    drainDelay: 0s
    timeout: 15s
  ops:
    pprof:
      enabled: true
  ofrepEventStream:
    baseUrl: https://flags.example.com
    inactivityDelaySec: 120
  validateFlags:
    maxJsonBodySize: 2MiB
    maxYamlBodySize: 128KiB
    maxTomlBodySize: 128KiB
observability:
  logging:
    level: info
    format: json
  metrics:
    enabled: true
  tracing:
    otlpEndpoint: otel-collector:4317
    serviceName: semaphore
    sampler: parentbased_always_off
evaluation:
  contextEnrichment:
    region: us-east-1
  environment: production
auth:
  adminKeys:
    - '[REDACTED]'
    - fromEnv: SEMAPHORE_ADMIN_KEY
version: 2
