apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "relay-proxy.fullname" . }}
  labels:
    app: {{ template "relay-proxy.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  semaphore-proxy.yml: {{- toYaml (tpl .Values.relayproxy.config .) | nindent 4 }}
  {{- range $name, $content := .Values.relayproxy.extraFiles }}
  {{ $name }}: {{- toYaml (tpl $content $) | nindent 4 }}
  {{- end }}
