version: 2
updates:
  # Main project
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
      time: "01:00"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
      exclude:
        - "github.com/thomaspoignant/go-feature-flag/modules/core"
    # Sibling modules share versions: separate PRs end up empty after rebase
    # and release-please then adds those empty commits to every package.
    groups:
      aws:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
          - "github.com/aws/smithy-go"
        update-types: ["minor", "patch"]
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
        update-types: ["minor", "patch"]
      testcontainers:
        patterns:
          - "github.com/testcontainers/testcontainers-go*"
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: "/modules/core"
    schedule:
      interval: daily
      time: "01:15"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore(dependencies)"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: "/rules"
    schedule:
      interval: daily
      time: "01:30"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
