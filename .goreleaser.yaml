version: 2
before:
  hooks:
    - go mod tidy
    - go generate ./...

dist: release

builds:
  # DEPRECATED: check go-feature-flag
  # We aim to deprecate the name relay proxy, so the main build should be called go-feature-flag
  - id: go-feature-flag-relay-proxy
    main: ./cmd/relayproxy
    binary: go-feature-flag-relay-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - 386
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    ignore:
      - goos: darwin
        goarch: 386
      - goos: linux
        goarch: arm
        goarm: 6
      - goos: windows
        goarch: arm

  - id: go-feature-flag
    main: ./cmd/relayproxy
    binary: go-feature-flag
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - 386
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    ignore:
      - goos: darwin
        goarch: 386
      - goos: linux
        goarch: arm
        goarm: 6
      - goos: windows
        goarch: arm

  # FIPS 140-3 build of the relay proxy.
  # Built with GOFIPS140 (Go Cryptographic Module, CMVP validated), which bakes a default
  # GODEBUG=fips140=on into the binary so it runs in FIPS mode out of the box.
  - id: go-feature-flag-fips
    main: ./cmd/relayproxy
    binary: go-feature-flag-fips
    env:
      - CGO_ENABLED=0
      # Version is read from the .fips-version file at the repo root and injected via the
      # GOFIPS140 environment variable (see the Makefile, GOFIPS140_VERSION). This repository
      # has no release workflow: export GOFIPS140 yourself before running goreleaser.
      - GOFIPS140={{ .Env.GOFIPS140 }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: go-feature-flag-cli
    main: ./cmd/cli
    binary: go-feature-flag-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - 386
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    ignore:
      - goos: darwin
        goarch: 386
      - goos: linux
        goarch: arm
        goarm: 6
      - goos: windows
        goarch: arm

  # Build an AWS lambda compatible binary
  - id: go-feature-flag-lambda
    main: ./cmd/relayproxy
    binary: bootstrap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    goarm:
      - "7"

archives:
  # DEPRECATED: check go-feature-flag
  - id: go-feature-flag-relay-proxy
    name_template: "go-feature-flag-relay-proxy_\
      {{ .Version }}_\
      {{- title .Os }}_\
      {{- if eq .Arch \"amd64\" }}x86_64\
      {{- else if eq .Arch \"386\" }}i386\
      {{- else }}{{ .Arch }}{{ end }}\
      {{- with .Arm }}v{{ . }}{{ end }}\
      {{- with .Mips }}_{{ . }}{{ end }}\
      {{- if not (eq .Amd64 \"v1\") }}{{ .Amd64 }}{{ end }}"
    ids:
      - go-feature-flag-relay-proxy
    files:
      - LICENSE
      - NOTICE

  - id: go-feature-flag
    name_template: "go-feature-flag_\
      {{ .Version }}_\
      {{- title .Os }}_\
      {{- if eq .Arch \"amd64\" }}x86_64\
      {{- else if eq .Arch \"386\" }}i386\
      {{- else }}{{ .Arch }}{{ end }}\
      {{- with .Arm }}v{{ . }}{{ end }}\
      {{- with .Mips }}_{{ . }}{{ end }}\
      {{- if not (eq .Amd64 \"v1\") }}{{ .Amd64 }}{{ end }}"
    ids:
      - go-feature-flag
    files:
      - LICENSE
      - NOTICE

  - id: go-feature-flag-fips
    name_template: "go-feature-flag-fips_\
      {{ .Version }}_\
      {{- title .Os }}_\
      {{- if eq .Arch \"amd64\" }}x86_64\
      {{- else if eq .Arch \"386\" }}i386\
      {{- else }}{{ .Arch }}{{ end }}\
      {{- with .Arm }}v{{ . }}{{ end }}\
      {{- with .Mips }}_{{ . }}{{ end }}\
      {{- if not (eq .Amd64 \"v1\") }}{{ .Amd64 }}{{ end }}"
    ids:
      - go-feature-flag-fips
    files:
      - LICENSE
      - NOTICE

  - id: go-feature-flag-cli
    name_template: "go-feature-flag-cli_\
      {{ .Version }}_\
      {{- title .Os }}_\
      {{- if eq .Arch \"amd64\" }}x86_64\
      {{- else if eq .Arch \"386\" }}i386\
      {{- else }}{{ .Arch }}{{ end }}\
      {{- with .Arm }}v{{ . }}{{ end }}\
      {{- with .Mips }}_{{ . }}{{ end }}\
      {{- if not (eq .Amd64 \"v1\") }}{{ .Amd64 }}{{ end }}"
    ids:
      - go-feature-flag-cli
    files:
      - LICENSE
      - NOTICE

  - id: goff-lambda
    name_template: "go-feature-flag-aws-lambda_{{ .Version }}"
    formats: zip
    ids:
      - go-feature-flag-lambda

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^testdata:"
      - "^.github"
      - "vendor"

dockers_v2:
  # go-feature-flag 
  - id: go-feature-flag
    ids:
      - go-feature-flag
    dockerfile: ./cmd/relayproxy/DockerfileGoreleaser
    images:
      - ghcr.io/blackbirdworks/go-feature-flag
    tags:
      - "latest"
      - "v{{ .RawVersion }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "A stand alone server to run GO Feature Flag"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BlackbirdWorks/go-feature-flag"
      "org.opencontainers.image.title": "go-feature-flag"
      "org.opencontainers.image.url": "https://github.com/BlackbirdWorks/go-feature-flag"
      "org.opencontainers.image.version": "{{ .Version }}"

  # go-feature-flag-fips (FIPS 140-3 build, gofeatureflag)
  # Shares the ghcr.io/blackbirdworks/go-feature-flag repo with the standard build, so every tag
  # MUST keep the `-fips` suffix to avoid overwriting the non-FIPS images.
  - id: go-feature-flag-fips
    ids:
      - go-feature-flag-fips
    dockerfile: ./cmd/relayproxy/DockerfileGoreleaserFips
    images:
      - ghcr.io/blackbirdworks/go-feature-flag
    tags:
      - "fips"
      - "v{{ .RawVersion }}-fips"
      - "v{{ .Major }}-fips"
      - "v{{ .Major }}.{{ .Minor }}-fips"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "A stand alone server to run GO Feature Flag, built in FIPS 140-3 mode (GOFIPS140)"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BlackbirdWorks/go-feature-flag"
      "org.opencontainers.image.title": "go-feature-flag-fips"
      "org.opencontainers.image.url": "https://github.com/BlackbirdWorks/go-feature-flag"
      "org.opencontainers.image.version": "{{ .Version }}"

  # go-feature-flag-bookworm
  - id: go-feature-flag-bookworm
    ids:
      - go-feature-flag
    dockerfile: ./cmd/relayproxy/DockerfileGoreleaserBookworm
    images:
      - ghcr.io/blackbirdworks/go-feature-flag
    tags:
      - "bookworm"
      - "v{{ .RawVersion }}-bookworm"
      - "v{{ .Major }}-bookworm"
      - "v{{ .Major }}.{{ .Minor }}-bookworm"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "A stand alone server to run GO Feature Flag"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BlackbirdWorks/go-feature-flag"
      "org.opencontainers.image.title": "go-feature-flag"
      "org.opencontainers.image.url": "https://github.com/BlackbirdWorks/go-feature-flag"
      "org.opencontainers.image.version": "{{ .Version }}"

  # go-feature-flag-trixie
  - id: go-feature-flag-trixie
    ids:
      - go-feature-flag
    dockerfile: ./cmd/relayproxy/DockerfileGoreleaserTrixie
    images:
      - ghcr.io/blackbirdworks/go-feature-flag
    tags:
      - "trixie"
      - "v{{ .RawVersion }}-trixie"
      - "v{{ .Major }}-trixie"
      - "v{{ .Major }}.{{ .Minor }}-trixie"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "A stand alone server to run GO Feature Flag"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BlackbirdWorks/go-feature-flag"
      "org.opencontainers.image.title": "go-feature-flag"
      "org.opencontainers.image.url": "https://github.com/BlackbirdWorks/go-feature-flag"
      "org.opencontainers.image.version": "{{ .Version }}"

  # cli
  - id: go-feature-flag-cli
    ids:
      - go-feature-flag-cli
    dockerfile: ./cmd/cli/Dockerfile
    images:
      - ghcr.io/blackbirdworks/go-feature-flag-cli
    tags:
      - "latest"
      - "v{{ .RawVersion }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "A command line tool to manage GO Feature Flag from your terminal"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BlackbirdWorks/go-feature-flag"
      "org.opencontainers.image.title": "go-feature-flag-cli"
      "org.opencontainers.image.url": "https://github.com/BlackbirdWorks/go-feature-flag"
      "org.opencontainers.image.version": "{{ .Version }}"
snapshot:
  version_template: "{{ incpatch .Version }}-next"

signs:
  - artifacts: checksum
    cmd: gpg
    args:
      [
        "--batch",
        "--yes",
        "--armor",
        "--pinentry-mode",
        "loopback",
        "--local-user",
        "{{ .Env.GPG_FINGERPRINT }}",
        "--output",
        "${signature}",
        "--detach-sign",
        "${artifact}",
      ]
    signature: "${artifact}.sig"
