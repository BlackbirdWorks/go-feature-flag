apiVersion: semaphore/v1
kind: Segments
segments:
  - name: churned
    connection: audiences
    key: semaphore:segment:{churned}
    version:
      key: semaphore:segment:churned:version
      interval: 5s
      debounce: 5s
  - name: staff
    connection: audiences
    mode: lookup
    layout: keys
    key: "staff:"
    missingKey: unknown
    version:
      value: "2026-11-27"
    cache:
      maxEntries: 50000
      ttl: 30s
