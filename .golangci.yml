# Mirrors BlackbirdWorks/gopherstack .golangci.yml (golangci-lint v2.15.0, the
# version pinned in the Makefile as GOLANGCI_LINT_VERSION): same linters, same settings, same
# thresholds, same formatters (goimports + golines, 120 columns).
#
# Deliberate differences from gopherstack:
#   - run.build-tags: docker, bench (this repo) instead of e2e.
#   - formatters.goimports.local-prefixes: github.com/blackbirdworks/semaphore.
#   - forbidigo: the two slog.Default/slog.New bans point at gopherstack's own
#     pkgs/logger package and are dropped (sloglint no-global: all still bans
#     the global slog logger); the generic fmt.Print ban is kept.
#   - ireturn.allow: semaphore polymorphic seams and external SDK interfaces.
#   - exclusions: gopherstack's per-service path rules are dropped; paths for
#     generated/vendored code of this repo are added (see exclusions.paths).
#   - modules: the single root module (incl. modules/core and rules/) is linted with this file;
#     only the antlr-generated files under rules/parser are excluded.
#
# This file is licensed under the terms of the MIT license https://opensource.org/license/mit
# Copyright (c) 2021-2025 Marat Reimers

## Golden config for golangci-lint v2.15.0
#
# This is the best config for golangci-lint based on my experience and opinion.
# It is very strict, but not extremely strict.
# Feel free to adapt it to suit your needs.
# If this config helps you, please consider keeping a link to this repo (see the next comment).

# Based on https://github.com/maratori/golangci-lint-config

version: "2"

run:
  # Cap concurrency to avoid memory/GC thrashing when loading SSA across
  # 200+ packages and large AWS SDK v2 dependency graphs.
  concurrency: 8
  timeout: 10m
  # semaphore: build tags used by this repo (docker integration tests, benchmarks).
  build-tags:
    - docker
    - bench

issues:
  # Maximum count of issues per linter.
  # Set to 0 to disable.
  # Default: 50
  max-issues-per-linter: 0
  # Maximum count of issues with the same text.
  # Set to 0 to disable.
  # Default: 3
  max-same-issues: 0

formatters:
  enable:
    - gci # kept from the previous configuration: import grouping
    - gofmt # kept from the previous configuration (with its rewrite rule)
    - goimports # checks if the code and import statements are formatted according to the 'goimports' command
    - golines # checks if code is formatted, and fixes long lines

    ## you may want to enable
    #- gci # checks if code and import statements are formatted, with additional rules
    #- gofmt # checks if the code is formatted according to 'gofmt' command
    #- gofumpt # enforces a stricter format than 'gofmt', while being backwards compatible
    #- swaggo # formats swaggo comments

  # All settings can be found here https://github.com/golangci/golangci-lint/blob/HEAD/.golangci.reference.yml
  settings:
    goimports:
      # A list of prefixes, which, if set, checks import paths
      # with the given prefixes are grouped after 3rd-party packages.
      # Default: []
      local-prefixes:
        - github.com/blackbirdworks/semaphore

    gci:
      # kept from the previous configuration (no-lex-order); the prefix section matches
      # goimports local-prefixes below.
      no-lex-order: true
      sections:
        - standard
        - default
        - prefix(github.com/blackbirdworks/semaphore)
    gofmt:
      simplify: false
      rewrite-rules:
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"

    golines:
      # Target maximum line length.
      # Default: 100
      max-len: 120
      # Disable tag reformatting in golines so tagalign is the single owner of struct tag alignment/sorting.
      # Default: true
      reformat-tags: false

linters:
  enable:
    - asasalint # checks for pass []any as any in variadic func(...any)
    - asciicheck # checks that your code does not contain non-ASCII identifiers
    - bidichk # checks for dangerous unicode character sequences
    - bodyclose # checks whether HTTP response body is closed successfully
    - canonicalheader # checks whether net/http.Header uses canonical header
    - containedctx # checks for structs containing context.Context fields
    - contextcheck # checks whether functions use a non-inherited context
    - copyloopvar # detects places where loop variables are copied (Go 1.22+)
    - cyclop # checks function and package cyclomatic complexity
    - depguard # checks if package imports are in a list of acceptable packages
    - dupl # tool for code clone detection
    - durationcheck # checks for two durations multiplied together
    - errcheck # checking for unchecked errors, these unchecked errors can be critical bugs in some cases
    - errchkjson # checks types passed to json encoding functions and error checks
    - errname # checks that sentinel errors are prefixed with the Err and error types are suffixed with the Error
    - errorlint # finds code that will cause problems with the error wrapping scheme introduced in Go 1.13
    - exhaustive # checks exhaustiveness of enum switch statements
    - exhaustruct_v5 # checks if all structure fields are initialized (scoped to config, options, DTO, manifest, event, and response structs)
    - exptostd # detects functions from golang.org/x/exp/ that can be replaced by std functions
    - fatcontext # detects nested contexts in loops
    - forbidigo # forbids identifiers
    - forcetypeassert # finds forced type assertions
    - funcorder # checks constructors and struct method ordering
    - funlen # tool for detection of long functions
    - gocheckcompilerdirectives # validates go compiler directive comments (//go:)
    - gochecknoglobals # checks that no global variables exist
    - gochecknoinits # checks that no init functions are present in Go code
    - gochecksumtype # checks exhaustiveness on Go "sum types"
    - gocognit # computes and checks the cognitive complexity of functions
    - goconst # finds repeated strings that could be replaced by a constant
    - gocritic # provides diagnostics that check for bugs, performance and style issues
    - gocyclo # computes and checks the cyclomatic complexity of functions
    - godot # checks if comments end in a period
    - gomoddirectives # manages the use of 'replace', 'retract', and 'excludes' directives in go.mod
    - goprintffuncname # checks that printf-like functions are named with f at the end
    - gosec # inspects source code for security problems
    - gosmopolitan # checks for i18n/l10n anti-patterns (Han string literals and time.Local)
    - govet # reports suspicious constructs, such as Printf calls whose arguments do not align with the format string
    - iface # checks the incorrect use of interfaces, helping developers avoid interface pollution
    - ineffassign # detects when assignments to existing variables are not used
    - intrange # finds places where for loops could make use of an integer range
    - ireturn # accept interfaces, return concrete types (genuine polymorphic seams allowed below)
    - loggercheck # checks key value pairs for common logger libraries (kitlog,klog,logr,zap)
    - maintidx # measures the maintainability index of each function
    - makezero # finds slice declarations with non-zero initial length
    - mirror # reports wrong mirror patterns of bytes/strings usage
    - mnd # detects magic numbers
    - musttag # enforces field tags in (un)marshaled structs
    - nakedret # finds naked returns in functions greater than a specified function length
    - nestif # reports deeply nested if statements
    - nilerr # finds the code that returns nil even if it checks that the error is not nil
    - nilnesserr # reports that it checks for err != nil, but it returns a different nil value error (powered by nilness and nilerr)
    - nilnil # checks that there is no simultaneous return of nil error and an invalid value
    - noctx # finds sending http request without context.Context
    - noinlineerr # disallows inline error handling in if statements
    - nolintlint # reports ill-formed or insufficient nolint directives
    - nonamedreturns # reports all named returns
    - nosprintfhostport # checks for misuse of Sprintf to construct a host with port in a URL
    - perfsprint # checks that fmt.Sprintf can be replaced with a faster alternative
    - predeclared # finds code that shadows one of Go's predeclared identifiers
    - promlinter # checks Prometheus metrics naming via promlint
    - protogetter # reports direct reads from proto message fields when getters should be used
    - reassign # checks that package variables are not reassigned
    - recvcheck # checks for receiver type consistency
    - revive # fast, configurable, extensible, flexible, and beautiful linter for Go, drop-in replacement of golint
    - rowserrcheck # checks whether Err of rows is checked successfully
    - sloglint # ensure consistent code style when using log/slog
    - spancheck # checks for mistakes with OpenTelemetry/Census spans
    - sqlclosecheck # checks that sql.Rows and sql.Stmt are closed
    - staticcheck # is a go vet on steroids, applying a ton of static analysis checks
    - tagalign # aligns and sorts struct field tags consistently
    - testableexamples # checks if examples are testable (have an expected output)
    - testifylint # checks usage of github.com/stretchr/testify
    - testpackage # makes you use a separate _test package
    - tparallel # detects inappropriate usage of t.Parallel() method in your Go test codes
    - unconvert # removes unnecessary type conversions
    - unparam # reports unused function parameters
    - unused # checks for unused constants, variables, functions and types
    - usestdlibvars # detects the possibility to use variables/constants from the Go standard library
    - usetesting # reports uses of functions with replacement inside the testing package
    - varnamelen # checks that the length of a variable's name matches its scope
    - wastedassign # finds wasted assignment statements
    - whitespace # detects leading and trailing whitespace
    - wrapcheck # checks that errors returned from external packages are wrapped
    - wsl_v5 # enforces whitespace formatting and statement grouping

    # ---- kept from the previous configuration (extra relative to gopherstack) ----
    - decorder
    - dogsled
    - ginkgolinter
    - godox
    - goheader
    - gomodguard_v2
    - grouper
    - importas
    - interfacebloat
    - misspell
    - zerologlint

    # ---- candidate linters, enabled once their findings were fixed ----
    - arangolint # ArangoDB client best practices
    - clickhouselint # ClickHouse native driver mistakes
    - dupword # duplicated words in comments and strings
    - embeddedstructfieldcheck # embedded fields first, separated from the regular ones
    - err113 # dynamic errors: sentinel or typed errors
    - godoclint # godoc practice, links to standard library identifiers
    - inamedparam # named parameters in interface methods
    - iotamixing # iota mixed with other declarations in a const block
    - lll # long lines (golines handles the code, lll the tests, the mocks and the strings)
    - modernize # suggests modern Go idioms (e.g. min/max builtins, slices package, etc.)
    - nlreturn # a blank line before return and branch statements
    - paralleltest # t.Parallel() in the tests
    - prealloc # slice declarations that could be preallocated
    - tagliatelle # struct tags follow their wire and config formats
    - thelper # test helpers call t.Helper() first
    - unqueryvet # SELECT * in SQL queries

  settings:
    forbidigo:
      # Forbid ad-hoc/global logging so every record goes through the
      # context-aware logger (pkgs/logger). The only legitimate slog.Default /
      # slog.New live in pkgs/logger itself (excluded below).
      forbid:
        # Preserve forbidigo's upstream default (no stray fmt.Print debugging).
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
        # Tests use testify only: require (stops the test, replaces Fatal) and assert
        # (continues, replaces Error).
        - pattern: '^(testing\.(T|B|F|TB)\.(Fatal|Fatalf|Error|Errorf)|\*testing\.(T|B|F)\.(Fatal|Fatalf|Error|Errorf))$'
          msg: use testify require (instead of Fatal) or assert (instead of Error)
      analyze-types: true

    cyclop:
      # The maximal code complexity to report.
      # Default: 10
      max-complexity: 13
      # The maximal average package complexity.
      # If it's higher than 0.0 (float) the check is enabled.
      # Default: 0.0
      package-average: 10.0

    depguard:
      # Rules to apply.
      #
      # Variables:
      # - File Variables
      #   Use an exclamation mark `!` to negate a variable.
      #   Example: `!$test` matches any file that is not a go test file.
      #
      #   `$all` - matches all go files
      #   `$test` - matches all go test files
      #
      # - Package Variables
      #
      #   `$gostd` - matches all of go's standard library (Pulled from `GOROOT`)
      #
      # Default (applies if no custom rules are defined): Only allow $gostd in all files.
      rules:
        "deprecated":
          # List of file globs that will match this list of settings to compare against.
          # By default, if a path is relative, it is relative to the directory where the golangci-lint command is executed.
          # The placeholder '${base-path}' is substituted with a path relative to the mode defined with `run.relative-path-mode`.
          # The placeholder '${config-path}' is substituted with a path relative to the configuration file.
          # Default: $all
          files:
            - "$all"
          # List of packages that are not allowed.
          # Entries can be a variable (starting with $), a string prefix, or an exact match (if ending with $).
          # Default: []
          deny:
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf instead, see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
            - pkg: github.com/satori/go.uuid
              desc: Use github.com/google/uuid instead, satori's package is not maintained
            - pkg: github.com/gofrs/uuid$
              desc: Use github.com/gofrs/uuid/v5 or later, it was not a go module before v5
        "no zap":
          files:
            - "$all"
          deny:
            - pkg: go.uber.org/zap
              desc: Use log/slog, the logger is built by cmdhelpers/cmdlog (zap was removed, see issue #36)
            - pkg: github.com/jsternberg/zap-logfmt
              desc: Use log/slog, cmdhelpers/cmdlog writes the logfmt format itself
            - pkg: github.com/samber/slog-zap
              desc: Use log/slog, there is no zap logger to bridge to
        "no echo, gin, swaggo":
          files:
            - "$all"
          deny:
            - pkg: github.com/labstack/echo
              desc: The relay proxy is served by net/http and huma (see issue #30), echo was removed
            - pkg: github.com/gin-gonic
              desc: The relay proxy is served by net/http (ServeMux) and huma, gin was tried and dropped (see issue #30)
            - pkg: github.com/swaggo
              desc: The OpenAPI document is generated from the huma operations, there are no swaggo annotations
        "non-test files":
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead, see https://go.dev/blog/randv2
        "controlplane is dependency-light":
          # The public document format package: its production files import only the standard library and
          # gopkg.in/yaml.v3, so an external control plane can import it cheaply (see issue #11). Only the files
          # of the root package: the optional subpackages (flagcheck, s3publish) may import the engine and the
          # AWS SDK.
          files:
            - "${base-path}/controlplane/*.go"
            - "!$test"
          allow:
            - $gostd
            - gopkg.in/yaml.v3
        "non-main files":
          files:
            - "!**/main.go"
            # The stdlib *log.Logger is still part of the public API of the deprecated legacy
            # Retriever and Exporter interfaces (and of their test doubles).
            - "!${base-path}/exporter/data_exporter.go"
            - "!${base-path}/exporter/exporter.go"
            - "!${base-path}/retriever/retriever.go"
            - "!${base-path}/testhelpers/mock/exporter_mock.go"
            - "!${base-path}/testhelpers/mock/mockretriever/initializable_retriever_legacy.go"
          deny:
            - pkg: log$
              desc: Use log/slog instead, see https://go.dev/blog/slog

    embeddedstructfieldcheck:
      # Checks that sync.Mutex and sync.RWMutex are not used as embedded fields.
      # Default: false
      forbid-mutex: true

    errcheck:
      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
      # Such cases aren't reported by default.
      # Default: false
      check-type-assertions: true

    exhaustive:
      # Program elements to check for exhaustiveness.
      # Default: [ switch ]
      check:
        - switch
        - mapliteral
      # Presence of a default case in switch statements satisfies exhaustiveness.
      # Default: false
      default-signifies-exhaustive: false

    # Scoped per Issue #59: a full-repo run measured 6,350 findings (5,981 in minimal
    # test literals and 369 in production code), so exhaustruct_v5 is enforced only on
    # configuration, options, settings, DTO, manifest, event, and response/document structs
    # where an omitted field is a bug (and test files remain excluded below).
    exhaustruct_v5:
      # List of regular expressions to match type names that should be skipped from checking.
      # Anonymous structs can be matched by '<anonymous>' alias.
      # Has precedence over `enforce-patterns`.
      # Each regular expression must match the full type name, including package path.
      # For example, to match type `net/http.Cookie` regular expression should be `.*/http\.Cookie`,
      # but not `http\.Cookie`.
      # Default: []
      ignore-patterns:
        # std libs
        - ^net/http\.Client$
        - ^net/http\.Cookie$
        - ^net/http\.Request$
        - ^net/http\.Response$
        - ^net/http\.Server$
        - ^net/http\.Transport$
        - ^net/url\.URL$
        - ^os/exec\.Cmd$
        - ^reflect\.StructField$
        # public libs
        - ^github\.com/Shopify/sarama\.Config$
        - ^github\.com/Shopify/sarama\.ProducerMessage$
        - ^github\.com/mitchellh/mapstructure\.DecoderConfig$
        - ^github\.com/prometheus/client_golang/.+Opts$
        - ^github\.com/spf13/cobra\.Command$
        - ^github\.com/spf13/cobra\.CompletionOptions$
        - ^github\.com/stretchr/testify/mock\.Mock$
        - ^github\.com/testcontainers/testcontainers-go.+Request$
        - ^github\.com/testcontainers/testcontainers-go\.FromDockerfile$
        - ^golang\.org/x/tools/go/analysis\.Analyzer$
        - ^google\.golang\.org/protobuf/.+Options$
        - ^gopkg\.in/yaml\.v3\.Node$
      enforce-patterns:
        - ^github\.com/blackbirdworks/semaphore/cmd/relayproxy/api/middleware\.(KeyAuthConfig|PrometheusConfig)$
        - ^github\.com/blackbirdworks/semaphore/cmd/relayproxy/metric\.MetricsOpts$
        - ^github\.com/blackbirdworks/semaphore/exporter\.Config$
        - ^github\.com/blackbirdworks/semaphore/exporter/(kafka|kinesis)exporter\.Settings$
        - ^github\.com/blackbirdworks/semaphore/exporter\.(FeatureEvent|TrackingEvent)$
        - ^github\.com/blackbirdworks/semaphore/internal/folderloader\.Options$
        - ^github\.com/blackbirdworks/semaphore/internal/flagstate\.(AllFlags|FlagState)$
        - ^github\.com/blackbirdworks/semaphore/retriever\.ManagerConfig$
        - ^github\.com/blackbirdworks/semaphore/cmdhelpers/manifest/model\.(FlagManifest|FlagDefinition)$
        - ^github\.com/blackbirdworks/semaphore/modules/core/dto\.(DTO|DTOv1|ExperimentationDto)$
        - ^github\.com/blackbirdworks/semaphore/modules/core/model\.(VariationResult|RawVarResult)$
        - ^github\.com/blackbirdworks/semaphore/cmd/relayproxy/model\..*(Response|ResponseError)$
        - ^github\.com/blackbirdworks/semaphore/cmd/relayproxy/handler/.*\.(.*Response|.*Output)$
      # Check only types matching enforce-patterns (or //exhaustruct:enforce).
      explicit-mode: true
      # Allows empty structures in return statements.
      # Default: false
      allow-empty-returns: true

    funcorder:
      # Checks that constructors are placed after the structure declaration and
      # exported methods before unexported ones.
      constructor: true
      struct-method: true

    funlen:
      # Checks the number of lines in a function.
      # If lower than 0, disable the check.
      # Default: 60
      lines: 100
      # Checks the number of statements in a function.
      # If lower than 0, disable the check.
      # Default: 40
      statements: 40

    gochecksumtype:
      # Presence of `default` case in switch statements satisfies exhaustiveness, if all members are not listed.
      # Default: true
      default-signifies-exhaustive: false

    gocyclo:
      # Minimal code complexity to report.
      # Default: 30
      min-complexity: 13

    gocognit:
      # Minimal code complexity to report.
      # Default: 30 (but we recommend 10-20)
      min-complexity: 20

    goconst:
      # Minimal occurrences count of string constant to report.
      # Default: 3
      min-occurrences: 3

    gocritic:
      # Enable all checks (the default set plus the opinionated ones).
      enable-all: true
      # Checks to disable.
      disabled-checks:
        - unnamedResult # contradicts nonamedreturns, which forbids named results

    godoclint:
      # List of rules to enable in addition to the default set.
      # Default: empty
      enable:
        # Assert no unused link in godocs.
        # https://github.com/godoc-lint/godoc-lint?tab=readme-ov-file#no-unused-link
        - no-unused-link
        # Require proper doc links to standard library declarations where applicable.
        # https://github.com/godoc-lint/godoc-lint?tab=readme-ov-file#require-stdlib-doclink
        - require-stdlib-doclink

    gomoddirectives:
      replace-local: true
      replace-allow-list:
        # fix for Athena v3 parquet query issue - https://github.com/xitongsys/parquet-go/issues/547
        - github.com/xitongsys/parquet-go

    govet:
      # Enable all analyzers.
      # Default: false
      enable-all: true
      # Disable analyzers by name.
      # Run `GL_DEBUG=govet golangci-lint run --enable=govet` to see default, all available analyzers, and enabled analyzers.
      # Default: []
      settings:
        shadow:
          strict: true
      # Settings per analyzer.

    inamedparam:
      # Skips check for interface methods with only a single parameter.
      # Default: false
      skip-single-param: true

    ireturn:
      # List of interfaces that are allowed to be returned.
      # Default: [anon, error, empty, stdlib]
      allow:
        - anon
        - error
        - empty
        - stdlib

    mnd:
      # List of function patterns to exclude from analysis.
      # Values always ignored: `time.Date`,
      # `strconv.FormatInt`, `strconv.FormatUint`, `strconv.FormatFloat`,
      # `strconv.ParseInt`, `strconv.ParseUint`, `strconv.ParseFloat`.
      # Default: []
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets.*
        - prometheus.LinearBuckets

    nakedret:
      # Make an issue if func has more lines of code than this setting, and it has naked returns.
      # Default: 30
      max-func-lines: 0

    testpackage:
      skip-regexp: '(export|internal)_test\.go'

    nolintlint:
      # Exclude following linters from requiring an explanation.
      # Default: []
      allow-no-explanation: []
      # Enable to require an explanation of nonzero length after each nolint directive.
      # Default: false
      require-explanation: true
      # Enable to require nolint directives to mention the specific linter being suppressed.
      # Default: false
      require-specific: true

    prealloc:
      # Report preallocation suggestions only on simple loops that have no returns/breaks/continues/gotos in them.
      simple: true
      # Report preallocation suggestions on range loops.
      range-loops: true
      # Report preallocation suggestions on for loops.
      for-loops: true

    perfsprint:
      # Enable every optimization.
      integer-format: true
      int-conversion: true
      error-format: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: true
      bool-format: true
      hex-format: true

    reassign:
      # Patterns for global variable names that are checked for reassignment.
      # See https://github.com/curioswitch/go-reassign#usage
      # Default: ["EOF", "Err.*"]
      patterns:
        - ".*"

    revive:
      # Enable every rule, then disable the ones owned by another linter or rejected on purpose.
      enable-all-rules: true
      rules:
        - name: line-length-limit
          disabled: true # owned by lll and golines
        - name: add-constant
          disabled: true # owned by mnd and goconst
        - name: cognitive-complexity
          disabled: true # owned by gocognit
        - name: function-length
          disabled: true # owned by funlen
        - name: cyclomatic
          disabled: true # owned by cyclop
        - name: unchecked-type-assertion
          disabled: true # owned by forcetypeassert and errcheck
        - name: confusing-results
          disabled: true # contradicts nonamedreturns
        - name: flag-parameter
          disabled: true # taste, no idiom behind it
        - name: nested-structs
          disabled: true # taste, no idiom behind it
        - name: comments-density
          disabled: true # taste, no idiom behind it
        - name: call-to-gc
          disabled: true # taste, no idiom behind it
        - name: enforce-switch-style
          disabled: true # taste, no idiom behind it

    sloglint:
      # Enforce not using global loggers.
      # Values:
      # - "": disabled
      # - "all": report all global loggers
      # - "default": report only the default slog logger
      # https://github.com/go-simpler/sloglint?tab=readme-ov-file#no-global
      # Default: ""
      no-global: all
      # Enforce using methods that accept a context.
      # Values:
      # - "": disabled
      # - "all": report all contextless calls
      # - "scope": report only if a context exists in the scope of the outermost function
      # https://github.com/go-simpler/sloglint?tab=readme-ov-file#context-only
      # Default: ""
      context: scope
      # Only typed attributes (slog.String, slog.Int, ...) as arguments of a log call, never alternating
      # keys and values. The attribute keys themselves are not forced to one case (key-naming-case): they are
      # part of the log output that pipelines parse (camelCase and snake_case both exist), and renaming one is a
      # compatibility break, see docs for the logging output.
      attr-only: true
      # Enforce using static values for log messages.
      static-msg: true

    staticcheck:
      # SAxxxx checks in https://staticcheck.dev/docs/configuration/options/#checks
      # Example (to disable some checks): [ "all", "-SA1000", "-SA1001"]
      # Default: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
      checks:
        - all
        # Use consistent method receiver names.
        # https://staticcheck.dev/docs/checks/#ST1016
        - -ST1016
        # Omit embedded fields from selector expression.
        # https://staticcheck.dev/docs/checks/#QF1008
        - -QF1008

    testifylint:
      # Enable all checkers (go-require included).
      enable-all: true

    unparam:
      # Inspect exported functions.
      # Default: false
      check-exported: true

    usetesting:
      # Enable/disable `os.TempDir()` detections.
      # Default: false
      os-temp-dir: true

    varnamelen:
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - i
        - ok
        - t
        - b
        - tb
        - w
        - r
        - ctx
        - err
        - tt
        - wg
        - mu
        - id

  exclusions:
    # Log a warning if an exclusion rule is unused.
    warn-unused: true
    # Generated files ("Code generated ... DO NOT EDIT") are skipped by default (generated: lax).
    paths:
      # files carried from upstream (UPSTREAM.md): kept verbatim so they can be re-synced
      - (^|/)modules/core/flagdef/query_jsonlogic_cache\.go$
      - (^|/)modules/core/flagdef/query_jsonlogic_cache_internal_test\.go$
      # antlr-generated files in rules/parser carry a "Code generated" header and are
      # skipped by the default generated: lax; hand-written files there are linted.
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # documentation stubs of the OpenAPI document (long example lines, never executed)
      - path: 'cmd/relayproxy/modeldocs/'
        linters: [ lll, godot, gochecknoglobals ]
      - path: '_test\.go'
        linters:
          - exhaustruct_v5
          - cyclop
          - dupl
          - funlen
          - gocognit
          - gosec
          - wrapcheck
