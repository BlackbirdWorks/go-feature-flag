version: 2
updates:
  # Main project
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
      time: "01:00"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    # Never let a bot bump a module that is replaced by a local directory or published
    # by the original upstream project: that would pull upstream code into this tree.
    ignore:
      - dependency-name: "github.com/blackbirdworks/semaphore*"
      - dependency-name: "github.com/thomaspoignant/go-feature-flag*"
      - dependency-name: "github.com/go-feature-flag/*"
      - dependency-name: "github.com/thomaspoignant/koanf-http-provider"
    # Sibling modules share versions: group related updates in one PR.
    groups:
      aws:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
          - "github.com/aws/smithy-go"
        update-types: ["minor", "patch"]
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
        update-types: ["minor", "patch"]
      testcontainers:
        patterns:
          - "github.com/testcontainers/testcontainers-go*"
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7

  # Base images of the release and local Dockerfiles (pinned by digest)
  - package-ecosystem: "docker"
    directories:
      - "/cmd/relayproxy"
      - "/cmd/cli"
    schedule:
      interval: weekly
      time: "04:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
