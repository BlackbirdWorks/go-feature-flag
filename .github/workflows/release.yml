name: Release

# A release is cut by running this workflow by hand (workflow_dispatch) on main and choosing
# a bump type (minor or major). The workflow reads the latest stable vMAJOR.MINOR.PATCH
# tag, computes the next version, creates the annotated tag and publishes it, all in this one
# run (a tag pushed with GITHUB_TOKEN does not start another workflow run, so the release job
# is chained to the tag job here instead):
#   - GitHub Release with the archives, checksums and SBOMs,
#   - container images on ghcr.io/blackbirdworks/semaphore and ghcr.io/blackbirdworks/semaphore-cli,
#   - build provenance attestations (keyless, GitHub OIDC) for the release files (the archives, through checksums.txt).
# Only the GITHUB_TOKEN is used: no other secret, no other registry, nothing is pushed to a
# branch or to another repository.
#
# dry_run=true (the default) computes and prints the next version, builds exactly the same
# artifacts (snapshot archives, every image variant) and creates no tag and publishes NOTHING.
#
# Other entry points, both of which publish an existing tag and never create or move one:
#   - a pushed tag (v*), for example a pre-release such as v0.2.0-rc.1 pushed by an owner;
#   - release_tag=<tag> on a manual run with dry_run=false started ON that tag (
#     `gh workflow run release.yml --ref <tag> ...`), to re-publish a tag whose release run failed. The attestations take
#     their source commit from the run, so the run must be on the tag for them to name the built commit.
# See docs/RELEASING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to increment from the latest stable tag (no tag yet: the first release is v0.1.0 whatever is chosen)"
        type: choice
        options:
          - minor
          - major
        default: minor
      dry_run:
        description: "Compute the next version and build everything, but create no tag and publish nothing"
        type: boolean
        default: true
      release_tag:
        description: "Re-publish this EXISTING tag instead of creating one (needs dry_run=false and the run started on that tag with gh workflow run --ref <tag>; the bump input is ignored; never moves the tag)"
        type: string
        required: false
        default: ""

permissions: {}

# One publishing run at a time; a run in progress is never cancelled. Dry runs get a group
# of their own per run so they can neither wait behind nor displace a pending release.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'publish' }}
  cancel-in-progress: false

env:
  # Version of GoReleaser (the config file uses the `version: 2` schema).
  GORELEASER_VERSION: "~> v2"

defaults:
  run:
    shell: bash

jobs:
  # Decides what the run does and computes the version: the next one for a bump, or the tag
  # that was pushed or named in release_tag (validated: it must be a release version).
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      dry-run: ${{ steps.plan.outputs.dry-run }}
      tag: ${{ steps.plan.outputs.tag }}
      create-tag: ${{ steps.plan.outputs.create-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag is needed to find the latest one
          persist-credentials: false
      - name: Compute the version and decide what the run does
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: .github/ci-scripts/release-plan.sh

  # Creates the annotated tag on the commit this run was started on (main) and pushes it.
  # The tag is made by github-actions[bot] and is not signed (the project has no signing key).
  create-tag:
    name: create tag
    needs: [plan]
    if: needs.plan.outputs.create-tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the token is passed to the push explicitly below
      - name: Create and push the tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Re-check right before pushing: the plan job ran earlier.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/tags/$TAG"

  # Dry run: the same builds as a release, with nothing published. Also builds the multi-arch
  # image variants (they are not pushed: GoReleaser skips publishing in snapshot mode).
  dry-run:
    name: dry run (snapshot build, no publish)
    needs: [plan]
    if: needs.plan.outputs.dry-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      - name: Run GoReleaser (snapshot, nothing is published)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish
      - name: List the artifacts
        run: |
          ls -lh release/
          cat release/checksums.txt
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Upload the archives for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-release
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.txt
            release/*.json
          retention-days: 3
          if-no-files-found: error

  release:
    name: release
    needs: [plan, create-tag]
    # create-tag is skipped for a pushed tag or release_tag; when it ran it must have succeeded.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.dry-run == 'false' && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One job on purpose: GoReleaser pushes the images and creates the GitHub Release.
    permissions:
      contents: write # create the GitHub Release and upload its files
      packages: write # push the images to ghcr.io/blackbirdworks/*
      id-token: write # keyless OIDC identity for the provenance attestations
      attestations: write # store the provenance attestations
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the tag itself (just created, pushed or named in release_tag): GoReleaser
          # derives the version from the tag on HEAD. The changelog is computed between tags.
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      - name: Release notes
        id: notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # The history holds the commits of the project this one derives from, so with no
          # previous release tag the generated changelog would list all of them.
          if git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" > /dev/null 2>&1; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            printf 'First release of Semaphore %s.\n\nSee the [documentation](https://github.com/BlackbirdWorks/semaphore/tree/%s/docs).\n' "$TAG" "$TAG" > "$RUNNER_TEMP/notes.md"
            echo "args=--release-notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          fi
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Several tags can point at HEAD (a stable tag on the commit of its -rc): GoReleaser
          # would take the highest by version order, the -rc. Pin the planned tag.
          GORELEASER_CURRENT_TAG: ${{ needs.plan.outputs.tag }}
      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/checksums.txt
