version: 2
before:
  hooks:
    - go mod tidy
    - go generate ./...

dist: release

builds:
  - id: semaphore
    main: ./cmd/relayproxy
    binary: semaphore
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - 386
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    ignore:
      - goos: darwin
        goarch: 386
      - goos: linux
        goarch: arm
        goarm: 6
      - goos: windows
        goarch: arm

  # FIPS 140-3 build of the relay proxy.
  # Built with GOFIPS140 (Go Cryptographic Module, CMVP validated), which bakes a default
  # GODEBUG=fips140=on into the binary so it runs in FIPS mode out of the box.
  - id: semaphore-fips
    main: ./cmd/relayproxy
    binary: semaphore-fips
    env:
      - CGO_ENABLED=0
      # Version is read from the .fips-version file at the repo root (single source of truth,
      # shared with the Makefile). It is set per build here, never exported for the whole
      # goreleaser run, so the other builds stay regular (non-FIPS) builds.
      - GOFIPS140={{ readFile ".fips-version" | trim }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: semaphore-cli
    main: ./cmd/cli
    binary: semaphore-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - 386
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    ignore:
      - goos: darwin
        goarch: 386
      - goos: linux
        goarch: arm
        goarm: 6
      - goos: windows
        goarch: arm

  # Build an AWS lambda compatible binary
  - id: semaphore-lambda
    main: ./cmd/relayproxy
    binary: bootstrap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    goarm:
      - "7"

archives:
  - id: semaphore
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "semaphore_\
      {{ .Version }}_\
      {{- title .Os }}_\
      {{- if eq .Arch \"amd64\" }}x86_64\
      {{- else if eq .Arch \"386\" }}i386\
      {{- else }}{{ .Arch }}{{ end }}\
      {{- with .Arm }}v{{ . }}{{ end }}\
      {{- with .Mips }}_{{ . }}{{ end }}\
      {{- if not (eq .Amd64 \"v1\") }}{{ .Amd64 }}{{ end }}"
    ids:
      - semaphore
    files:
      - LICENSE
      - NOTICE
      - rules/LICENSE
      - internal/koanfhttpprovider/LICENSE

  - id: semaphore-fips
    name_template: "semaphore-fips_\
      {{ .Version }}_\
      {{- title .Os }}_\
      {{- if eq .Arch \"amd64\" }}x86_64\
      {{- else if eq .Arch \"386\" }}i386\
      {{- else }}{{ .Arch }}{{ end }}\
      {{- with .Arm }}v{{ . }}{{ end }}\
      {{- with .Mips }}_{{ . }}{{ end }}\
      {{- if not (eq .Amd64 \"v1\") }}{{ .Amd64 }}{{ end }}"
    ids:
      - semaphore-fips
    files:
      - LICENSE
      - NOTICE
      - rules/LICENSE
      - internal/koanfhttpprovider/LICENSE

  - id: semaphore-cli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "semaphore-cli_\
      {{ .Version }}_\
      {{- title .Os }}_\
      {{- if eq .Arch \"amd64\" }}x86_64\
      {{- else if eq .Arch \"386\" }}i386\
      {{- else }}{{ .Arch }}{{ end }}\
      {{- with .Arm }}v{{ . }}{{ end }}\
      {{- with .Mips }}_{{ . }}{{ end }}\
      {{- if not (eq .Amd64 \"v1\") }}{{ .Amd64 }}{{ end }}"
    ids:
      - semaphore-cli
    files:
      - LICENSE
      - NOTICE
      - rules/LICENSE
      - internal/koanfhttpprovider/LICENSE

  - id: semaphore-lambda
    name_template: "semaphore-aws-lambda_{{ .Version }}"
    formats: zip
    ids:
      - semaphore-lambda

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^testdata:"
      - "^.github"
      - "vendor"

dockers_v2:
  # semaphore
  - id: semaphore
    ids:
      - semaphore
    dockerfile: ./cmd/relayproxy/DockerfileGoreleaser
    extra_files:
      - LICENSE
      - NOTICE
      - rules/LICENSE
      - internal/koanfhttpprovider/LICENSE
    images:
      - ghcr.io/blackbirdworks/semaphore
    tags:
      - "latest"
      - "v{{ .RawVersion }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "A stand alone server to run Semaphore"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BlackbirdWorks/semaphore"
      "org.opencontainers.image.title": "semaphore"
      "org.opencontainers.image.url": "https://github.com/BlackbirdWorks/semaphore"
      "org.opencontainers.image.version": "{{ .Version }}"

  # semaphore-fips (FIPS 140-3 build, semaphore)
  # Shares the ghcr.io/blackbirdworks/semaphore repo with the standard build, so every tag
  # MUST keep the `-fips` suffix to avoid overwriting the non-FIPS images.
  - id: semaphore-fips
    ids:
      - semaphore-fips
    dockerfile: ./cmd/relayproxy/DockerfileGoreleaserFips
    extra_files:
      - LICENSE
      - NOTICE
      - rules/LICENSE
      - internal/koanfhttpprovider/LICENSE
    images:
      - ghcr.io/blackbirdworks/semaphore
    tags:
      - "fips"
      - "v{{ .RawVersion }}-fips"
      - "v{{ .Major }}-fips"
      - "v{{ .Major }}.{{ .Minor }}-fips"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "A stand alone server to run Semaphore, built in FIPS 140-3 mode (GOFIPS140)"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BlackbirdWorks/semaphore"
      "org.opencontainers.image.title": "semaphore-fips"
      "org.opencontainers.image.url": "https://github.com/BlackbirdWorks/semaphore"
      "org.opencontainers.image.version": "{{ .Version }}"

  # semaphore-bookworm
  - id: semaphore-bookworm
    ids:
      - semaphore
    dockerfile: ./cmd/relayproxy/DockerfileGoreleaserBookworm
    extra_files:
      - LICENSE
      - NOTICE
      - rules/LICENSE
      - internal/koanfhttpprovider/LICENSE
    images:
      - ghcr.io/blackbirdworks/semaphore
    tags:
      - "bookworm"
      - "v{{ .RawVersion }}-bookworm"
      - "v{{ .Major }}-bookworm"
      - "v{{ .Major }}.{{ .Minor }}-bookworm"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "A stand alone server to run Semaphore"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BlackbirdWorks/semaphore"
      "org.opencontainers.image.title": "semaphore"
      "org.opencontainers.image.url": "https://github.com/BlackbirdWorks/semaphore"
      "org.opencontainers.image.version": "{{ .Version }}"

  # semaphore-trixie
  - id: semaphore-trixie
    ids:
      - semaphore
    dockerfile: ./cmd/relayproxy/DockerfileGoreleaserTrixie
    extra_files:
      - LICENSE
      - NOTICE
      - rules/LICENSE
      - internal/koanfhttpprovider/LICENSE
    images:
      - ghcr.io/blackbirdworks/semaphore
    tags:
      - "trixie"
      - "v{{ .RawVersion }}-trixie"
      - "v{{ .Major }}-trixie"
      - "v{{ .Major }}.{{ .Minor }}-trixie"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "A stand alone server to run Semaphore"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BlackbirdWorks/semaphore"
      "org.opencontainers.image.title": "semaphore"
      "org.opencontainers.image.url": "https://github.com/BlackbirdWorks/semaphore"
      "org.opencontainers.image.version": "{{ .Version }}"

  # cli
  - id: semaphore-cli
    ids:
      - semaphore-cli
    dockerfile: ./cmd/cli/Dockerfile
    extra_files:
      - LICENSE
      - NOTICE
      - rules/LICENSE
      - internal/koanfhttpprovider/LICENSE
    images:
      - ghcr.io/blackbirdworks/semaphore-cli
    tags:
      - "latest"
      - "v{{ .RawVersion }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.description": "A command line tool to manage Semaphore from your terminal"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BlackbirdWorks/semaphore"
      "org.opencontainers.image.title": "semaphore-cli"
      "org.opencontainers.image.url": "https://github.com/BlackbirdWorks/semaphore"
      "org.opencontainers.image.version": "{{ .Version }}"
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# SBOM of every archive (SPDX, generated with syft, which the release workflow installs).
sboms:
  - artifacts: archive

# Archives and checksums are attested with GitHub build provenance by the release workflow
# (actions/attest-build-provenance, keyless, verified with `gh attestation verify`). There is
# no detached GPG signature: the project has no signing key.

release:
  github:
    owner: BlackbirdWorks
    name: semaphore
  # A tag with a pre-release suffix (v0.1.0-rc.1) is published as a GitHub pre-release.
  prerelease: auto
  draft: false
