suite: test service links
templates:
  - deployment.yaml
tests:
  - it: should not inject the service links by default
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false

  - it: should allow the service links to be enabled
    set:
      enableServiceLinks: true
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: true
