name: CI

# Pull request pipeline. Layout follows BlackbirdWorks/gopherstack: one workflow,
# fan-out jobs, a final aggregating gate. Branch protection should require the
# single check "ci-ok" (job `ci-ok`) and nothing else from this file.
# No secrets are used; every job runs with the read-only GITHUB_TOKEN.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

# Only the latest commit of a PR needs CI: a new push cancels the in-flight run
# for the same PR. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Minimum total LINE coverage (percent) of the merged profiles; the `coverage`
  # job fails below it. The target is 90 (the repository ruleset requires it for
  # the native GitHub coverage rule). This is a ratchet: it is the floor of the
  # measured total and is raised in the same pull request that adds tests,
  # until it reaches 90. Local equivalent: task coverage COVERAGE_MIN=<n>.
  COVERAGE_MIN: "92"
  # Packages run in parallel and share one Ryuk reaper; a package can latch onto
  # a reaper that is shutting down and time out after 60s. Runners are
  # ephemeral and the tests terminate their own containers.
  TESTCONTAINERS_RYUK_DISABLED: "true"

defaults:
  run:
    shell: bash

jobs:
  # Documentation-only pull requests skip the heavy jobs. A skipped job counts
  # as success in `ci-ok`, so the required check still reports.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request the checkout is a merge commit: HEAD^1 is the base tip.
          fetch-depth: 2
          persist-credentials: false
      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"
          # Anything outside documentation and templates is code.
          if grep -qvE '^(docs/|\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md)|.*\.md$|LICENSE$|NOTICE$)' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^docs/' <<< "$changed"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  # Two jobs so the FIPS compile (a different toolchain configuration that
  # shares little of the build cache) runs next to the regular build.
  build:
    name: build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      # All modules, relay proxy, jsonschema generator and cli.
      - run: task build

  # Smoke-test the FIPS variant so a dependency that breaks under GOFIPS140
  # is caught here rather than at release time.
  build-fips:
    name: build (fips)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - run: task build-relayproxy-fips

  # One Go module: the root module, which includes modules/core and rules.
  lint:
    name: lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - run: task lint
      - run: task vet
      - run: task fix-check

  modules:
    name: modules (tidy, verify)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - run: task tidy-check
      - run: task verify

  vulncheck:
    name: vulncheck
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - run: task vuln-check

  # Test types run as separate parallel jobs; each calls the Taskfile target a
  # developer runs locally. Every job writes a coverage profile (artifact, plus
  # Codecov when a CODECOV_TOKEN secret exists) under a distinct flag.

  # Root module unit tests (no docker tag), sharded by package group. The shard
  # lists come from `go list` (.github/ci-scripts/test-pkgs.sh), so a new
  # package is always picked up; the first step fails if the shards stop
  # partitioning `go list ./...`.
  test-unit-root:
    name: test (unit, root, ${{ matrix.group }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        group: [cmd, plugins, rest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - name: Check that the test shards cover every package
        run: task test-shards-check
      - name: Run unit tests with the race detector
        env:
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p test-logs coverage
          task test-unit-root GROUP="$GROUP" \
            COVERPROFILE="coverage/unit-root-$GROUP.out" \
            TEST_LOG="test-logs/unit-root-$GROUP.log"
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-log-unit-root-${{ matrix.group }}
          path: test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-root-${{ matrix.group }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/unit-root-${{ matrix.group }}.out
          flags: unit
          name: unit-root-${{ matrix.group }}
          fail_ci_if_error: false

  # testcontainers tests (azurite, mongo, postgres, redis, ...): packages with
  # docker-tagged test files that are not gopherstack e2e (see test-pkgs.sh).
  test-integration:
    name: test (integration, containers)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - name: Pre-pull container images
        run: |
          .github/ci-scripts/pull-images.sh \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            mongo:6 \
            postgres:15-alpine \
            redis:7
      - name: Run integration tests with the race detector
        run: |
          mkdir -p test-logs coverage
          task test-integration \
            COVERPROFILE=coverage/integration.out \
            TEST_LOG=test-logs/integration.log
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-log-integration
          path: test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/integration.out
          flags: integration
          name: integration
          fail_ci_if_error: false

  # S3/SQS/Kinesis/relay proxy e2e tests against gopherstack
  # (ghcr.io/blackbirdworks/gopherstack, a public image pulled anonymously).
  test-e2e:
    name: test (e2e, gopherstack)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - name: Pre-pull the gopherstack and Valkey images
        run: |
          # The gopherstack tag is the single source of truth in the test helper. The Valkey image is the one of the
          # segment provider tests (modules/core/segment/valkeysegment).
          image=$(sed -n 's/^[[:space:]]*Image = "\(.*\)"$/\1/p' testhelpers/gopherstack/gopherstack.go)
          [[ -n "$image" ]] || { echo "::error::cannot read the gopherstack image"; exit 1; }
          .github/ci-scripts/pull-images.sh "$image" docker.io/valkey/valkey:8-alpine
      - name: Run e2e tests with the race detector
        run: |
          mkdir -p test-logs coverage
          task test-e2e \
            COVERPROFILE=coverage/e2e.out \
            TEST_LOG=test-logs/e2e.log
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-log-e2e
          path: test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-e2e
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/e2e.out
          flags: e2e
          name: e2e
          fail_ci_if_error: false

  # Merges the profiles of every test job (a block covered by any suite counts
  # once), applies .github/ci-scripts/coverage-exclude.txt, prints the totals
  # to the job summary, fails below COVERAGE_MIN and publishes the Cobertura
  # file that GitHub's native coverage reads. Same script as `task coverage`.
  # Runs even when a suite failed, so a diagnostic summary of the partial
  # profiles still exists; the minimum is enforced and the Cobertura upload is
  # allowed only when every suite succeeded (output `complete`). A failed suite
  # still fails ci-ok through its own result.
  coverage:
    name: coverage
    needs: [changes, test-unit-root, test-integration, test-e2e]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # "false" when the tested tree (pull request merge commit) differs from the
      # pull request head: the native upload tags the report with the head SHA,
      # so it would attach merge-tree line numbers to the wrong revision.
      head-tested: ${{ steps.tree.outputs.head-tested }}
      # "true" only when every test suite succeeded (profiles are complete).
      complete: ${{ steps.suites.outputs.complete }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Only `go tool cover` needs Go here; no module download, so a proxy
      # outage cannot block the coverage diagnostics.
      - uses: $/.github/actions/setup-go
        with:
          cache: "false"
          download: "false"
      - name: Check the unit tests of the CI scripts
        run: task test-ci-scripts
      - name: Check the tested tree is the pull request head
        id: tree
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            echo "head-tested=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tested merge commit differs from the PR head (branch not up to date); native coverage upload skipped"
          else
            echo "head-tested=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Not coverage-*: a rerun would also pull in the published coverage-report.
          pattern: coverage-{unit-*,integration,e2e}
          path: coverage
      - name: Check that every test suite succeeded
        id: suites
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # `changes` is included: all of them must be success.
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* || " $RESULTS " == *" skipped "* ]]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::a test suite did not succeed ($RESULTS): partial coverage summary, minimum not enforced"
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge profiles, report and enforce the minimum
        env:
          COMPLETE: ${{ steps.suites.outputs.complete }}
        run: |
          if ! find coverage -maxdepth 2 -name '*.out' | grep -q .; then
            echo "::warning::no coverage profile available (every test suite failed early)"
            [[ "$COMPLETE" == true ]] && exit 1 || exit 0
          fi
          # Partial profiles must never be judged against the minimum.
          min="$COVERAGE_MIN"
          [[ "$COMPLETE" == true ]] || min=""
          set +e
          task coverage-report COVERAGE_MIN="$min"
          rc=$?
          [[ -f coverage/report/summary.md ]] && cat coverage/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Upload merged coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 14
          if-no-files-found: ignore

  # Native GitHub code coverage (GitHub Code Quality, public preview). OFF until
  # the repository variable NATIVE_COVERAGE_UPLOAD is "true". Reason: the branch
  # ruleset on main requires 90% line coverage, so uploading before the total
  # reaches 90% would block every pull request, including the ones that add
  # tests. Switch on (no code change) with:
  #   gh variable set NATIVE_COVERAGE_UPLOAD --body true -R BlackbirdWorks/semaphore
  # Separate job so `code-quality: write` is granted to nothing else.
  # `pull-requests: read` is for the push-to-main run (PR discovery). Fork pull
  # requests cannot write and are skipped.
  coverage-upload:
    name: coverage (upload to GitHub)
    needs: [coverage]
    if: ${{ vars.NATIVE_COVERAGE_UPLOAD == 'true' && needs.coverage.outputs.head-tested == 'true' && needs.coverage.outputs.complete == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download the merged Cobertura report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage-report
      - name: Upload coverage to GitHub
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage-report/cobertura.xml
          language: Go
          label: code-coverage/go

  # Fuzz smoke: one matrix leg per package holding fuzz targets, discovered at
  # run time so new targets are never skipped. Each leg compiles only its own
  # package; targets inside a leg share the build cache.
  fuzz-plan:
    name: fuzz (plan)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
        with:
          cache: "false"
          download: "false"
      - name: List packages with fuzz targets
        id: plan
        run: |
          list=$(task fuzz-list)
          echo "$list"
          [[ -n "$list" ]] || { echo "::error::no fuzz targets found"; exit 1; }
          matrix=$(jq -Rsc '{include: (split("\n") | map(select(length > 0) | split(" ") | {module: .[0], dir: .[1]}))}' <<< "$list")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.module }} ${{ matrix.dir }})
    needs: [fuzz-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fuzz-plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - run: task fuzz-dir MODULE="$FUZZ_MODULE" DIR="$FUZZ_DIR" FUZZTIME=10s
        env:
          FUZZ_MODULE: ${{ matrix.module }}
          FUZZ_DIR: ${{ matrix.dir }}

  # Protocol compatibility of the relay proxy with the real Java, JavaScript,
  # Go and .NET OpenFeature providers, against two locally started proxies.
  provider-tests:
    name: provider-tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.8.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 23
          package-manager-cache: false
      - name: Install ICU packages
        run: sudo apt-get update && sudo apt-get install -y libicu-dev
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "9.0.x"
      - run: task provider-tests

  # The release configuration is exercised on every pull request so it cannot rot between
  # releases: `goreleaser check`, a snapshot build of the FIPS target for the runner (the build
  # with its own settings; it uses the same entry point and ldflags as the others). Nothing is published. The
  # regular and CLI binaries are compiled by the build job; the full multi-platform snapshot, all archives and every image
  # are built only by the "Release" workflow dry run (workflow_dispatch).
  release-check:
    name: release (goreleaser check, snapshot build)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup-go
      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      # The FIPS build is the one with its own settings (GOFIPS140 read from .fips-version) and
      # the regular and CLI builds are compiled by the build job; building only this id keeps the job short.
      - name: Snapshot build of the FIPS binary for this platform
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target --id semaphore-fips
      - name: Check the version baked into the binary
        run: |
          bin=$(ls release/semaphore-fips_linux_amd64*/semaphore-fips)
          go version -m "$bin" | grep -- '-X main.version='
          go version -m "$bin" | grep -- 'GOFIPS140='
      - name: Check the Dockerfiles that GoReleaser does not build here
        run: |
          # Every release Dockerfile must drop root and keep its entrypoint.
          for f in cmd/relayproxy/DockerfileGoreleaser* cmd/cli/Dockerfile; do
            grep -q '^USER 65532:65532$' "$f" || { echo "::error file=$f::the image must run as uid 65532"; exit 1; }
            grep -q '^ENTRYPOINT \[' "$f" || { echo "::error file=$f::the image must set an ENTRYPOINT"; exit 1; }
          done

  # Build the VitePress documentation site when docs/ changes.
  docs-build:
    name: docs (vitepress build)
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build documentation site
        run: |
          npm --prefix docs ci
          npm --prefix docs run build

  # Single required check for branch protection. `needs` lists every job above;
  # a job skipped by the path filter counts as success, a failed or cancelled
  # one (any matrix leg included) fails the gate. `if: always()` makes the gate
  # run (and report) even when an upstream job failed.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - build
      - build-fips
      - lint
      - modules
      - vulncheck
      - test-unit-root
      - test-integration
      - test-e2e
      - coverage
      - coverage-upload
      - fuzz-plan
      - fuzz
      - provider-tests
      - release-check
      - docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to be successful or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. != "success" and . != "skipped")' > /dev/null; then
            echo "::error::at least one required job failed or was cancelled"
            exit 1
          fi
