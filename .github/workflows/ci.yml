name: CI

# Pull request pipeline. Layout follows BlackbirdWorks/gopherstack: one workflow,
# fan-out jobs, a final aggregating gate. Branch protection should require the
# single check "ci-ok" (job `ci-ok`) and nothing else from this file.
# No secrets are used; every job runs with the read-only GITHUB_TOKEN.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

# Only the latest commit of a PR needs CI: a new push cancels the in-flight run
# for the same PR. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Packages run in parallel and share one Ryuk reaper; a package can latch onto
  # a reaper that is shutting down and time out after 60s. Runners are
  # ephemeral and the tests terminate their own containers.
  TESTCONTAINERS_RYUK_DISABLED: "true"

defaults:
  run:
    shell: bash

jobs:
  # Documentation-only pull requests skip the heavy jobs. A skipped job counts
  # as success in `ci-ok`, so the required check still reports.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request the checkout is a merge commit: HEAD^1 is the base tip.
          fetch-depth: 2
          persist-credentials: false
      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"
          # Anything outside documentation, templates and release-please metadata is code.
          if grep -qvE '^(website/|docs/|\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md|release-please/)|.*\.md$|LICENSE$)' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Two jobs so the FIPS compile (a different toolchain configuration that
  # shares little of the build cache) runs next to the regular build.
  build:
    name: build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      # All modules, relay proxy, jsonschema generator and cli.
      - run: make build

  # Smoke-test the FIPS variant so a dependency that breaks under GOFIPS140
  # is caught here rather than at release time.
  build-fips:
    name: build (fips)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: make build-relayproxy-fips

  # One job per module so a failure in one never hides findings in another.
  lint:
    name: lint (${{ matrix.name }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            module: "."
          - name: modules/core
            module: modules/core
          - name: rules
            module: rules
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: make lint-module MODULE="${{ matrix.module }}"
      # Optional target: it runs only once the Makefile defines it, so this
      # job needs no change when it lands. Not module specific: root leg only.
      - name: Run mulint (if the target exists)
        if: matrix.name == 'root'
        run: |
          if make -n mulint > /dev/null 2>&1; then
            make mulint
          else
            echo "No mulint target, skipping."
          fi

  modules:
    name: modules (tidy, verify)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: make tidy-check
      - run: make verify

  vulncheck:
    name: vulncheck
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: make vuln-check

  swagger:
    name: swagger
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: make swagger
      - name: Fail if the generated swagger docs are out of date
        run: git diff --exit-code --stat

  # Test types run as separate parallel jobs; each calls the Makefile target a
  # developer runs locally. Every job writes a coverage profile (artifact, plus
  # Codecov when a CODECOV_TOKEN secret exists) under a distinct flag.

  # Root module unit tests (no docker tag), sharded by package group. The shard
  # lists come from `go list` (.github/ci-scripts/test-pkgs.sh), so a new
  # package is always picked up; the first step fails if the shards stop
  # partitioning `go list ./...`.
  test-unit-root:
    name: test (unit, root, ${{ matrix.group }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        group: [cmd, plugins, rest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Check that the test shards cover every package
        run: make test-shards-check
      - name: Run unit tests with the race detector
        env:
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p test-logs coverage
          make test-unit-root GROUP="$GROUP" \
            COVERPROFILE="coverage/unit-root-$GROUP.out" \
            TEST_LOG="test-logs/unit-root-$GROUP.log"
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: test-log-unit-root-${{ matrix.group }}
          path: test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: coverage-unit-root-${{ matrix.group }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/unit-root-${{ matrix.group }}.out
          flags: unit
          name: unit-root-${{ matrix.group }}
          fail_ci_if_error: false

  # `rules` and `modules/core` are separate Go modules with their own tests.
  test-unit-modules:
    name: test (unit, ${{ matrix.module }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: rules
            flag: rules
            artifact: rules
          - module: modules/core
            flag: core
            artifact: core
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Run unit tests with the race detector
        env:
          MODULE: ${{ matrix.module }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p test-logs coverage
          make test-unit-module MODULE="$MODULE" \
            COVERPROFILE="coverage/unit-$ARTIFACT.out" \
            TEST_LOG="test-logs/unit-$ARTIFACT.log"
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: test-log-unit-${{ matrix.artifact }}
          path: test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: coverage-unit-${{ matrix.artifact }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/unit-${{ matrix.artifact }}.out
          flags: ${{ matrix.flag }}
          name: unit-${{ matrix.artifact }}
          fail_ci_if_error: false

  # testcontainers tests (azurite, mongo, postgres, redis, ...): packages with
  # docker-tagged test files that are not gopherstack e2e (see test-pkgs.sh).
  test-integration:
    name: test (integration, containers)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Pre-pull container images
        run: |
          .github/ci-scripts/pull-images.sh \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            mongo:6 \
            postgres:15-alpine \
            redis:7
      - name: Run integration tests with the race detector
        run: |
          mkdir -p test-logs coverage
          make test-integration \
            COVERPROFILE=coverage/integration.out \
            TEST_LOG=test-logs/integration.log
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: test-log-integration
          path: test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: coverage-integration
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/integration.out
          flags: integration
          name: integration
          fail_ci_if_error: false

  # S3/SQS/Kinesis/relay proxy e2e tests against gopherstack
  # (ghcr.io/blackbirdworks/gopherstack, a public image pulled anonymously).
  test-e2e:
    name: test (e2e, gopherstack)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Pre-pull the gopherstack image
        run: |
          # The tag is the single source of truth in the test helper.
          image=$(sed -n 's/^[[:space:]]*Image = "\(.*\)"$/\1/p' testutils/gopherstack/gopherstack.go)
          [[ -n "$image" ]] || { echo "::error::cannot read the gopherstack image"; exit 1; }
          .github/ci-scripts/pull-images.sh "$image"
      - name: Run e2e tests with the race detector
        run: |
          mkdir -p test-logs coverage
          make test-e2e \
            COVERPROFILE=coverage/e2e.out \
            TEST_LOG=test-logs/e2e.log
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: test-log-e2e
          path: test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: coverage-e2e
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/e2e.out
          flags: e2e
          name: e2e
          fail_ci_if_error: false

  # Fuzz smoke: one matrix leg per package holding fuzz targets, discovered at
  # run time so new targets are never skipped. Each leg compiles only its own
  # package; targets inside a leg share the build cache.
  fuzz-plan:
    name: fuzz (plan)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: List packages with fuzz targets
        id: plan
        run: |
          list=$(make --no-print-directory fuzz-list)
          echo "$list"
          [[ -n "$list" ]] || { echo "::error::no fuzz targets found"; exit 1; }
          matrix=$(jq -Rsc '{include: (split("\n") | map(select(length > 0) | split(" ") | {module: .[0], dir: .[1]}))}' <<< "$list")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.module }} ${{ matrix.dir }})
    needs: [fuzz-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fuzz-plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: make fuzz-dir MODULE="${{ matrix.module }}" DIR="${{ matrix.dir }}" FUZZTIME=10s

  # Protocol compatibility of the relay proxy with the real Java, JavaScript,
  # Go and .NET OpenFeature providers, against two locally started proxies.
  provider-tests:
    name: provider-tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.8.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 23
          package-manager-cache: false
      - name: Install ICU packages
        run: sudo apt-get update && sudo apt-get install -y libicu-dev
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "9.0.x"
      - run: make provider-tests


  # Single required check for branch protection. `needs` lists every job above;
  # a job skipped by the path filter counts as success, a failed or cancelled
  # one (any matrix leg included) fails the gate. `if: always()` makes the gate
  # run (and report) even when an upstream job failed.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - build
      - build-fips
      - lint
      - modules
      - vulncheck
      - swagger
      - test-unit-root
      - test-unit-modules
      - test-integration
      - test-e2e
      - fuzz-plan
      - fuzz
      - provider-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to be successful or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. != "success" and . != "skipped")' > /dev/null; then
            echo "::error::at least one required job failed or was cancelled"
            exit 1
          fi
