server:
  mode: http
  port: 1032
pollingInterval: 1000
startWithRetrieverError: false
retriever:
  kind: file
  path: ./openfeature/provider_tests/flags.yaml
exporter:
  kind: log
authorizedKeys:
  evaluation:
    - authorized_token
enableSwagger: true
# Upstream providers compare the response metadata strictly: only send the legacy gofeatureflag_cacheable key.
disableSemaphoreMetadata: true
