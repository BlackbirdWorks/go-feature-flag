name: Helm Lint and Test Charts
on: pull_request

permissions: {}

jobs:
  lint-helm-chart:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER: chart-testing
      IMAGE_REPOSITORY: go-feature-flag
      IMAGE_TAG: ci
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.11.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Get changed files in the docs folder
        id: changed-files-specific
        uses: marceloprado/has-changed-path@df1b7a3161b8fb9fd8c90403c66a9e66dfde50cb # v1.0.1
        with:
          paths: ./cmd/relayproxy/helm-charts/ ./cmd/relayproxy/Dockerfile.local ./.github/workflows/ci-helm.yaml

      - name: Run chart-testing (lint)
        working-directory: ./cmd/relayproxy/helm-charts/relay-proxy/
        run: ct lint --chart-dirs . --charts .

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 #v1.15.2
        if: steps.changed-files-specific.outputs.changed == 'true'
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}

      # This repository publishes no image, so build the relay proxy from the
      # sources of the PR and load it straight into the kind nodes. The chart is
      # then tested against the code under review, not a published image.
      - name: Build the relay proxy image
        if: steps.changed-files-specific.outputs.changed == 'true'
        run: make build-relayproxy-docker RELAYPROXY_IMAGE="$IMAGE_REPOSITORY:$IMAGE_TAG"

      - name: Load the image into the kind cluster
        if: steps.changed-files-specific.outputs.changed == 'true'
        run: kind load docker-image "$IMAGE_REPOSITORY:$IMAGE_TAG" --name "$KIND_CLUSTER"

      - name: Run chart-testing (install)
        working-directory: ./cmd/relayproxy/helm-charts/relay-proxy/
        run: ct install --chart-dirs . --charts . --helm-extra-set-args "--set=image.repository=$IMAGE_REPOSITORY --set=image.tag=$IMAGE_TAG --set=image.pullPolicy=Never"
        if: steps.changed-files-specific.outputs.changed == 'true'
