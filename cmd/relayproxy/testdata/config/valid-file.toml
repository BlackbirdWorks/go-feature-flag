pollingInterval = 1000
startWithRetrieverError = false
enableSwagger = true
host = ""

[authorizedKeys]
evaluation = [ "apikey1", "apikey2" ]

[server]
port = 1031
mode = "http"

[retriever]
kind = "http"
url = "https://raw.githubusercontent.com/BlackbirdWorks/semaphore/main/cmd/relayproxy/testdata/dockerhub-example/flags.goff.yaml"

[exporter]
kind = "log"
